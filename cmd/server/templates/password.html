<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 필요 - Pastebox</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #111213;
            --text: #ededed;
            --text-muted: #8a9099;
            --hairline: rgba(255, 255, 255, 0.08);
            --hairline-strong: rgba(255, 255, 255, 0.16);
            --focus-ring: #5b8cb4;
        }

        html {
            box-sizing: border-box;
        }

        *, *::before, *::after {
            box-sizing: inherit;
        }

        html, body {
            width: 100%;
            overflow-x: hidden;
        }

        * {
            font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji", sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        :focus-visible {
            outline: 3px solid var(--focus-ring);
            outline-offset: 2px;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            min-height: 76px;
            padding: 18px 28px;
            background: linear-gradient(180deg, rgba(8, 8, 9, 0.97), rgba(8, 8, 9, 0.88));
            border-bottom: 1px solid var(--hairline);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .navbar .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: none;
            margin: 0;
            padding: 0;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .navbar-brand img {
            height: 32px;
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 140px 20px 80px;
            box-sizing: border-box;
        }

        .content-wrapper {
            max-width: 450px;
            width: 100%;
            text-align: center;
        }

        .info-section {
            background: var(--surface);
            border: 1px solid var(--hairline);
            border-radius: 0;
            padding: 32px 28px;
            text-align: center;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            color: var(--text);
            margin-top: 0;
            margin-bottom: 8px;
        }

        .description {
            font-size: 15px;
            line-height: 1.5;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .error-message {
            color: #ef4444;
            font-size: 15px;
            margin-bottom: 24px;
            font-weight: 500;
        }

        .form-group {
            text-align: left;
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--hairline-strong);
            border-radius: 0;
            padding: 12px 16px;
            color: var(--text);
            font-size: 15px;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--focus-ring);
        }

        .button {
            width: 100%;
            background: #e8ecef;
            color: #111315;
            border: 1px solid #e8ecef;
            border-radius: 0;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.18s ease, border-color 0.18s ease;
        }

        .button:hover {
            background: #fff;
            border-color: #fff;
        }

        .button:active {
            transform: none;
        }

        .back-link {
            display: inline-block;
            margin-top: 24px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--text);
        }

        @media (max-width: 768px) {
            .navbar {
                min-height: 60px;
                padding: 14px 16px;
            }

            .navbar-brand img {
                height: 26px;
            }

            .main-container {
                padding: 112px 16px 56px;
            }

            .info-section {
                padding: 28px 20px;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a class="navbar-brand" href="/">
                <img data-cfasync="false" loading="eager" decoding="async" src="https://cdn.krfoss.org/web/ROKFOSS.png" alt="ROKFOSS">
            </a>
        </div>
    </nav>

    <main class="main-container">
        <div class="content-wrapper">
            <div class="info-section">
                <h1>비밀번호 필요</h1>
                
                {{ if .Error }}
                <p class="error-message">{{ .Error }}</p>
                {{ else }}
                <p class="description">비밀번호로 보호된 데이터입니다. 열람하려면 비밀번호를 입력하세요.</p>
                {{ end }}

                <form method="post" action="{{ .Action }}">
                    <div class="form-group">
                        <label for="password">비밀번호</label>
                        <input type="password" id="password" name="password" class="form-control" placeholder="비밀번호를 입력하세요" required autofocus>
                    </div>
                    <button type="submit" class="button">데이터 보기</button>
                </form>

                <a href="/" class="back-link">메인으로 돌아가기</a>
            </div>
        </div>
    </main>
</body>
</html>
